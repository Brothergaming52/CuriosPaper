# ==============================================================================
#                      CuriosPaper 3.0 Configuration
#      Ultra-modular, lightweight custom accessory engine for Paper 1.20.6+
# ==============================================================================

# Active language file located in plugins/CuriosPaper/languages/<language>.yml
# If the specified language file is not found, automatically falls back to en_US.yml.
language: "en_US"

# Resource Pack Settings
# CuriosPaper does not host its own resource pack. It automatically extracts its
# textures, models, and equipment assets and registers/injects them directly into
# the server's resource pack host plugin (Priority: Synthetix -> Nexo -> ItemsAdder -> Oraxen -> CraftEngine -> RSPM).
resource-pack:
  # Desired pack host plugin to inject CuriosPaper's assets into.
  # Options:
  # - "AUTO"         : Automatically detects the best available host plugin (Synthetix is #1 priority).
  # - "SYNTHETIX"    : Injects into Synthetix resource pack manager.
  # - "NEXO"         : Injects into Nexo resource pack.
  # - "ITEMSADDER"   : Injects into ItemsAdder resource pack.
  # - "ORAXEN"       : Injects into Oraxen resource pack.
  # - "CRAFTENGINE"  : Injects into CraftEngine resource pack.
  # - "RSPM"         : Injects into ResourcePackManager (RSPM) pack.
  # - "NONE"         : Disables external injection.
  host-plugin: "AUTO"

# Feature toggles
features:
  # Allow elytra equipping in back slots with automatic flight capabilities
  allow-elytra-on-back-slot: true

  # Quick-equip accessories by shift + right-clicking them in hand or hotbar
  quick-equip-right-click: true

  # Play sound when opening GUI
  play-gui-sound: true
  gui-sound: "BLOCK_CHEST_OPEN"

  # Play sound when equipping item
  play-equip-sound: true
  equip-sound: "ENTITY_ITEM_PICKUP"

  # Play sound when unequipping item
  play-unequip-sound: true
  unequip-sound: "ENTITY_ITEM_PICKUP"

  # Hotkey system to open accessory GUI
  # When Synthetix is present, automatically registers with Synthetix Universal Keybinds.
  hotkey:
    enabled: true
    slot: 8  # Which hotbar slot (1-9) must be selected (8 = slot 8, -1 = any slot)
    sneak-type: "double"  # Options: "double" (double tap shift), "single", "hold"
    sneak-hold-duration: 3  # Seconds to hold sneak (for 'hold' type)

  # Curios inventory death drop behavior
  # Options:
  # - "Auto"   : Drops or keeps the inventory according to the gamerule keepInventory (compatible with grave plugins)
  # - "Always" : Player always keeps curios inventory on death even when keepInventory is false
  # - "Never"  : Player always drops curios inventory on death even when keepInventory is true
  keep-curio-inventory:
    type: "Auto"

# 3D Accessory Model Rendering Engine
# Supports both clientbound Packet mode and Universal Non-Persistent Entity mode.
# Options for mode:
# - "auto"   : Uses packet mode if supported, otherwise automatically falls back to universal entity mode.
# - "packet" : Enforces packet mode.
# - "entity" : Uses high-performance non-persistent entity mode (universal across all server platforms).
models:
  enabled: true
  mode: "auto"
  tracking-distance: 48.0
  update-interval-ticks: 1
  hide-in-first-person: false
  auto-render-engine-models: true

# ==============================================================================
# Storage Settings
# CuriosPaper automatically uses database storage (SQLite, MySQL, MongoDB, or YAML)
# when Synthetix is installed by utilizing Synthetix's AddonDataStore.
# When running standalone without Synthetix, player inventories are stored
# in plugins/CuriosPaper/data/players/<uuid>.yml flatfiles.
# ==============================================================================
storage:
  # Periodic auto-save interval in minutes for player curios inventory (0 = disable)
  auto-save-interval: 5

# Modular Item Engine Integrations
# Automatically connects with Nexo, Oraxen, ItemsAdder, CraftEngine, and Synthetix.
item-engines:
  enabled: true
  auto-detect-slots: true
  auto-render-models: true
  apply-item-meta-attributes: true

  nexo:
    enabled: true
  oraxen:
    enabled: true
  itemsadder:
    enabled: true
  craftengine:
    enabled: true

  # Manual slot mappings for external items (e.g. "nexo:ruby_ring": "ring")
  mappings: {}

# Debug settings
debug:
  enabled: false
  log-inventory-events: false
